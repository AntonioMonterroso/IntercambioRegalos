<style>
:root{
  --fondo:#F6F0E4;
  --papel:#FFFDF8;
  --papel-2:#FBF6EC;
  --tinta:#1D1B16;
  --tenue:#655F53;
  --linea:#E3D8C3;
  --pino:#1E3A2B;
  --pino-suave:#E3ECE5;
  --vino:#7B2232;
  --vino-suave:#F5E4E6;
  --oro:#9A7230;
  --oro-claro:#C9A35A;
  --oro-suave:#F3E8D2;
  --sobre-pino:#F6F0E4;
  --sombra:0 1px 2px rgba(40,30,10,.06),0 8px 24px -12px rgba(40,30,10,.18);
  --radio:14px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --f-titulo:"Fraunces",Georgia,serif;
  --f-texto:"Manrope",ui-sans-serif,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#101612;
    --papel:#18211B;
    --papel-2:#1D2720;
    --tinta:#F1EADB;
    --tenue:#A9A391;
    --linea:#2E3A31;
    --pino:#8DBB9C;
    --pino-suave:#1F3328;
    --vino:#E8909C;
    --vino-suave:#3A2026;
    --oro:#D9B56C;
    --oro-claro:#D9B56C;
    --oro-suave:#332A19;
    --sobre-pino:#101612;
    --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fondo:#101612;--papel:#18211B;--papel-2:#1D2720;--tinta:#F1EADB;--tenue:#A9A391;--linea:#2E3A31;
  --pino:#8DBB9C;--pino-suave:#1F3328;--vino:#E8909C;--vino-suave:#3A2026;--oro:#D9B56C;--oro-claro:#D9B56C;
  --oro-suave:#332A19;--sobre-pino:#101612;--sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f-texto);font-size:16px;line-height:1.55;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(90deg,var(--vino) 0 28px,var(--oro-claro) 28px 34px,var(--pino) 34px 62px,var(--oro-claro) 62px 68px);z-index:5}
h1,h2,h3{font-family:var(--f-titulo);font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em;font-optical-sizing:auto}
p{margin:0}
a{color:var(--pino)}
.svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.svg.s{width:16px;height:16px}
.svg.l{width:28px;height:28px}
.envoltura{max-width:1040px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0 12px}
.marca{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--tinta);font-family:var(--f-titulo);font-weight:600;font-size:1.15rem}
.marca .sello{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--pino);color:var(--sobre-pino)}
#sesion{display:flex;align-items:center;gap:8px;min-width:0}
#sesion .quien{font-size:.875rem;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
main{padding:8px 0 64px}
.vista{animation:entra .32s var(--ease-out)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.btn{appearance:none;border:1px solid transparent;border-radius:12px;font:600 .95rem/1 var(--f-texto);padding:0 18px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;transition:background-color .16s var(--ease-out),border-color .16s var(--ease-out),color .16s var(--ease-out),transform .12s var(--ease-out),opacity .16s var(--ease-out);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.icono:focus-visible,.chip:focus-visible{outline:3px solid var(--oro-claro);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[disabled]:active{transform:none}
.prim{background:var(--pino);color:var(--sobre-pino)}
.vino{background:var(--vino);color:var(--sobre-pino)}
.sec{background:var(--papel);border-color:var(--linea);color:var(--tinta)}
.fantasma{background:transparent;color:var(--tinta);border-color:transparent}
.peligro{background:transparent;border-color:var(--linea);color:var(--vino)}
.salida{background:var(--vino-suave);color:var(--vino);border-color:transparent}
.btn.ancho{width:100%}
.btn.chico{min-height:38px;padding:0 12px;font-size:.875rem;border-radius:10px}
@media (hover:hover) and (pointer:fine){
  .prim:hover:not([disabled]){background:color-mix(in srgb,var(--pino) 88%,#000)}
  .vino:hover:not([disabled]){background:color-mix(in srgb,var(--vino) 88%,#000)}
  .sec:hover:not([disabled]),.fantasma:hover:not([disabled]){border-color:var(--oro-claro)}
  .peligro:hover{border-color:var(--vino)}
  .icono:hover{background:var(--papel-2);border-color:var(--linea)}
  .chip:hover{border-color:var(--oro-claro)}
}
.icono{appearance:none;border:1px solid transparent;background:transparent;color:var(--tenue);border-radius:10px;width:44px;height:44px;display:inline-grid;place-items:center;cursor:pointer;transition:background-color .16s var(--ease-out),border-color .16s var(--ease-out),transform .12s var(--ease-out)}
.icono:active{transform:scale(.97)}
.icono.wa{color:var(--pino)}
.panel{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:24px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--oro)}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
.campo{margin-bottom:16px}
.ayuda{font-size:.82rem;color:var(--tenue);margin-top:6px}
input,textarea{width:100%;font:500 1rem/1.4 var(--f-texto);color:var(--tinta);background:var(--papel-2);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;min-height:46px;transition:border-color .16s var(--ease-out),background-color .16s var(--ease-out)}
textarea{resize:vertical;min-height:96px}
input:focus,textarea:focus{border-color:var(--oro-claro);background:var(--papel);outline:none}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--tenue) 70%,transparent)}
.prefijo{position:relative}
.prefijo span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--tenue)}
.prefijo input{padding-left:34px}
.codigo-in{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:1.35rem;letter-spacing:.22em;text-transform:uppercase;text-align:center;font-weight:700}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.12em;font-weight:700}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:center;padding:32px 0 40px}
.hero h1{font-size:clamp(2.2rem,1.4rem + 3.4vw,3.9rem);font-weight:600}
.hero h1 em{font-style:italic;color:var(--vino);font-weight:500}
.hero .lead{font-size:1.1rem;color:var(--tenue);max-width:34ch;margin-top:20px}
.hero .eyebrow{margin-bottom:16px}
.pasos{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:12px;max-width:40ch}
.pasos li{display:flex;gap:12px;align-items:flex-start;color:var(--tinta)}
.pasos b{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--oro-suave);color:var(--oro);font-family:var(--f-titulo);font-size:.95rem}
.entrar h2{font-size:1.45rem;margin-bottom:18px}
.entrar .btn{margin-top:4px}
.organiza{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px;border-radius:var(--radio);background:var(--pino);color:var(--sobre-pino);flex-wrap:wrap}
.organiza h2{font-size:1.5rem}
.organiza p{opacity:.85;margin-top:6px;max-width:52ch}
.organiza .btn{background:var(--sobre-pino);color:var(--pino)}
.recientes{margin-top:32px}
.recientes h3{font-family:var(--f-texto);font-size:.85rem;font-weight:700;color:var(--tenue);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--linea);background:var(--papel);color:var(--tinta);border-radius:999px;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;gap:8px;font:600 .9rem var(--f-texto);cursor:pointer;transition:border-color .16s var(--ease-out),transform .12s var(--ease-out)}
.chip:active{transform:scale(.97)}
.chip small{font-weight:500;color:var(--tenue)}
.volver{display:inline-flex;align-items:center;gap:6px;color:var(--tenue);text-decoration:none;font-weight:600;font-size:.9rem;margin:8px 0 20px;min-height:44px}
.cabeza{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.cabeza-txt{flex:1 1 300px;min-width:0}
.cabeza h1{font-size:clamp(1.9rem,1.3rem + 2.4vw,3rem)}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;color:var(--tenue);font-size:.95rem}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .presu{color:var(--tinta);font-weight:700}
.nota{margin-top:14px;padding:12px 14px;border-left:3px solid var(--oro-claro);background:var(--oro-suave);border-radius:0 10px 10px 0;font-size:.95rem;white-space:pre-line;max-width:70ch}
.rejilla{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.columna{display:grid;gap:24px;min-width:0}
.titulo-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.titulo-panel h2{font-size:1.3rem}
.conteo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.conteo div{background:var(--papel-2);border:1px solid var(--linea);border-radius:12px;padding:14px}
.conteo b{display:block;font-family:var(--f-titulo);font-size:1.7rem;line-height:1.1}
.conteo span{font-size:.82rem;color:var(--tenue)}
.barra{height:8px;border-radius:99px;background:var(--papel-2);border:1px solid var(--linea);overflow:hidden;margin-top:14px}
.barra i{display:block;height:100%;background:var(--pino);border-radius:99px;transition:width .5s var(--ease-out)}
.sorteo-ok{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--pino-suave);color:var(--pino);font-weight:600;font-size:.95rem}
.sorteo-falta{padding:12px 14px;border-radius:12px;background:var(--oro-suave);color:var(--tinta);font-size:.95rem}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.agregar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.agregar textarea{min-height:46px;height:46px;resize:none;overflow:hidden}
.buscar{position:relative;margin-bottom:12px}
.buscar .svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tenue)}
.buscar input{padding-left:40px}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 10px 10px 14px;border:1px solid var(--linea);border-radius:12px;background:var(--papel)}
.fila .nombre{font-weight:700;overflow-wrap:anywhere}
.fila .datos{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:4px;font-size:.82rem;color:var(--tenue)}
.fila .datos .mono{color:var(--tinta);font-size:.9rem}
.marca-si{display:inline-flex;align-items:center;gap:4px;color:var(--pino);font-weight:600}
.marca-no{display:inline-flex;align-items:center;gap:4px}
.fila .botones{display:flex;gap:4px}
.vacio{padding:28px 16px;text-align:center;color:var(--tenue);border:1px dashed var(--linea);border-radius:12px}
.clave-org{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clave-org .mono{font-size:1.3rem;color:var(--vino)}
.secreto{position:relative;overflow:hidden;background:var(--pino);color:var(--sobre-pino);border-radius:20px;padding:28px;box-shadow:var(--sombra)}
.secreto::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:22px solid color-mix(in srgb,var(--oro-claro) 35%,transparent)}
.secreto .eyebrow{color:var(--oro-claro)}
.secreto .amigo{font-family:var(--f-titulo);font-size:clamp(2.2rem,1.6rem + 3vw,3.6rem);font-weight:600;line-height:1.05;margin:12px 0 4px;position:relative;z-index:1;transition:filter .45s var(--ease-out),opacity .45s var(--ease-out);overflow-wrap:anywhere}
.secreto .amigo.oculto{filter:blur(14px);opacity:.6;user-select:none}
.secreto .btn{position:relative;z-index:1;margin-top:18px;background:var(--sobre-pino);color:var(--pino)}
.secreto p{position:relative;z-index:1;opacity:.88}
.deseos-amigo{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.deseos-amigo li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--papel-2);border:1px solid var(--linea);overflow-wrap:anywhere}
.deseos-amigo li::before{content:"";flex:none;width:7px;height:7px;margin-top:9px;border-radius:2px;background:var(--oro-claro);transform:rotate(45deg)}
.cuenta{display:flex;gap:10px;flex-wrap:wrap}
.cuenta div{min-width:72px;text-align:center;padding:10px 8px;border-radius:12px;background:var(--papel-2);border:1px solid var(--linea)}
.cuenta b{display:block;font-family:var(--f-titulo);font-size:1.6rem;line-height:1.1}
.cuenta span{font-size:.75rem;color:var(--tenue);text-transform:uppercase;letter-spacing:.08em}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px;border-radius:12px;border:1px solid var(--linea);background:var(--papel-2);cursor:pointer;margin:0}
.interruptor input{position:absolute;opacity:0;width:1px;height:1px}
.interruptor .riel{flex:none;width:52px;height:30px;border-radius:99px;background:var(--linea);position:relative;transition:background-color .2s var(--ease-out)}
.interruptor .riel::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--papel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease-out)}
.interruptor input:checked + .riel{background:var(--pino)}
.interruptor input:checked + .riel::after{transform:translateX(22px)}
.interruptor input:focus-visible + .riel{outline:3px solid var(--oro-claro);outline-offset:2px}
.estado-guardado{font-size:.82rem;color:var(--tenue);min-height:1.2em}
.aviso-config{padding:16px;border-radius:12px;background:var(--vino-suave);color:var(--vino);font-weight:600;margin-bottom:20px}
dialog{border:none;padding:0;background:transparent;color:var(--tinta);max-width:min(480px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(16,22,18,.5)}
dialog[open] .caja{animation:dlg .22s var(--ease-out)}
@keyframes dlg{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.caja{background:var(--papel);border:1px solid var(--linea);border-radius:18px;padding:24px;box-shadow:var(--sombra)}
.caja h2{font-size:1.35rem;margin-bottom:10px}
.caja .texto{color:var(--tenue);margin-bottom:18px}
.caja .pie{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:20px}
.caja .codigo-grande{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:2rem;font-weight:700;letter-spacing:.18em;text-align:center;padding:16px;border-radius:12px;background:var(--oro-suave);color:var(--vino);margin:8px 0 12px}
.menu{display:grid;gap:8px}
.menu .btn{justify-content:flex-start}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--tinta);color:var(--fondo);padding:12px 18px;border-radius:12px;font-weight:600;font-size:.92rem;box-shadow:var(--sombra);pointer-events:none;transition:opacity .2s var(--ease-out),transform .2s var(--ease-out);z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.ver{opacity:1;transform:translate(-50%,0)}
#toast.error{background:var(--vino);color:#fff}
.cargando{display:grid;place-items:center;min-height:40vh;color:var(--tenue)}
.giro{width:28px;height:28px;border-radius:50%;border:3px solid var(--linea);border-top-color:var(--pino);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
footer{padding:24px 0 40px;color:var(--tenue);font-size:.85rem;border-top:1px solid var(--linea)}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:28px;padding-top:16px}
  .rejilla{grid-template-columns:1fr}
}
@media (max-width:520px){
  .envoltura{padding:0 16px}
  .panel{padding:18px}
  .dos{grid-template-columns:1fr;gap:0}
  .agregar{grid-template-columns:1fr}
  .conteo b{font-size:1.4rem}
  .secreto{padding:22px}
  .organiza .btn{width:100%}
  .caja{padding:20px}
  .caja .pie .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  .vista{animation:aparece .2s ease-out}
  @keyframes aparece{from{opacity:0}to{opacity:1}}
  dialog[open] .caja{animation:aparece .15s ease-out}
  .btn:active,.icono:active,.chip:active{transform:none}
  .barra i,.interruptor .riel::after{transition:none}
  .secreto .amigo{transition:opacity .2s ease-out}
}
</style>
</head>
<body>
<div class="envoltura">
  <header class="top">
    <a href="#" class="marca" id="irInicio" title="Volver al inicio"><span class="sello"><svg class="svg" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg></span>Intercambio</a>
    <div id="sesion"></div>
  </header>
  <main id="app"><div class="cargando"><div class="giro"></div></div></main>
  <footer>Intercambio de regalos · cada código es personal, no lo compartas con nadie más.</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlgTitulo"></dialog>
<script>
const SB_URL = "__SB_URL__";

async function rpc(fn, args) {
  if (!configurado) throw new Error('La base de datos todavía no está conectada.');
  const h = {'Content-Type': 'application/json', 'apikey': SB_KEY};
  if (SB_KEY.startsWith('eyJ')) h.Authorization = 'Bearer ' + SB_KEY;
  let r;
  try {
    r = await fetch(SB_URL.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {method: 'POST', headers: h, body: JSON.stringify(args || {})});
  } catch {
    throw new Error('Sin conexión. Revisa tu internet e intenta otra vez.');
  }
  const t = await r.text();
  let d = null;
  try { d = t ? JSON.parse(t) : null; } catch { d = t; }
  if (!r.ok) throw new Error((d && d.message) || 'Algo falló. Intenta otra vez.');
  return d;
}

let toastT;
function aviso(msg, error = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('error', error);
  t.classList.add('ver');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('ver'), error ? 4200 : 2400);
}

function abrirDialogo(html, alAbrir) {
  const d = $('#dlg');
  d.innerHTML = `<div class="caja">${html}</div>`;
  if (!d.open) d.showModal();
  d.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', () => d.close()));
  if (alAbrir) alAbrir(d);
  return d;
}
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') e.target.close(); });

function confirmar({titulo, texto, si = 'Sí, continuar', tipo = 'prim'}) {
  return new Promise(res => {
    let r = false;
    const d = abrirDialogo(`<h2 id="dlgTitulo">${esc(titulo)}</h2><p class="texto">${texto}</p>
      <div class="pie"><button class="btn sec" data-cerrar title="Cerrar sin hacer nada">Cancelar</button><button class="btn ${tipo}" id="dlgSi">${esc(si)}</button></div>`,
      d => d.querySelector('#dlgSi').addEventListener('click', () => { r = true; d.close(); }));
    d.addEventListener('close', () => res(r), {once: true});
  });
}

async function copiar(texto, msg = 'Copiado') {
  try { await navigator.clipboard.writeText(texto); aviso(msg); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); aviso(msg); } catch { aviso('No se pudo copiar', true); }
    ta.remove();
  }
}

function cargando(btn, si) {
  if (!btn) return;
  if (si) { btn.dataset.txt = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="giro" style="width:18px;height:18px;border-width:2px"></span>'; }
  else { btn.disabled = false; if (btn.dataset.txt) btn.innerHTML = btn.dataset.txt; }
}

function fechaLarga(iso, mayus = true) {
  if (!iso) return '';
  const d = new Date(iso);
  const f = d.toLocaleDateString('es-GT', {weekday: 'long', day: 'numeric', month: 'long'});
  const h = d.toLocaleTimeString('es-GT', {hour: 'numeric', minute: '2-digit'});
  return (mayus ? f.charAt(0).toUpperCase() + f.slice(1) : f) + ', ' + h;
}
function aLocal(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function deLocal(v) { return v ? new Date(v).toISOString() : null; }

function enlaces(t) {
  return esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u.length > 48 ? u.slice(0, 45) + '…' : u}</a>`);
}
function lineas(t) { return String(t || '').split(/\n+/).map(s => s.trim()).filter(Boolean); }

function enlaceBase() { return location.origin + location.pathname; }
function mensajeWhats(p, evento) {
  return `Hola ${p.nombre}, ya estás en el intercambio de regalos «${evento}».\n\nTu código secreto es: ${p.codigo}\n\nEntra aquí para ver a quién le regalas y escribir tu lista de deseos:\n${enlaceBase()}#c=${p.codigo}\n\nNo le pases tu código a nadie.`;
}

function guardarReciente(r) {
  const l = LS.leer('ir_recientes', []).filter(x => x.codigo !== r.codigo);
  l.unshift(r);
  LS.poner('ir_recientes', l.slice(0, 8));
}
function quitarReciente(codigo) { LS.poner('ir_recientes', LS.leer('ir_recientes', []).filter(x => x.codigo !== codigo)); }

  const s = $('#sesion');

  } else s.innerHTML = '';
  const b = $('#bSalir');

function detenerRelojes() { clearInterval(reloj); clearInterval(cuentaReloj); reloj = null; cuentaReloj = null; }

function ir(vista, extra = {}) {
  detenerRelojes();
  estado = {vista, codigo: extra.codigo || null, datos: extra.datos || null};
  if (vista === 'inicio') pintarInicio();
  if (vista === 'crear') pintarCrear();
  if (vista === 'organizador') pintarOrganizador();
  if (vista === 'participante') pintarParticipante();
  pintarSesion();
  window.scrollTo(0, 0);
}

async function entrarCon(codigo, btn) {
  const c = limpiarCodigo(codigo);
  if (c.length < 6) { aviso('Escribe tu código completo', true); return; }
  cargando(btn, true);
  try {
    const r = await rpc('entrar', {p_codigo: c});
    if (r.tipo === 'organizador') {
      const datos = await rpc('admin_ver', {p_codigo: c});
      LS.poner('ir_sesion', {codigo: c, tipo: 'organizador'});
      guardarReciente({codigo: c, tipo: 'organizador', nombre: datos.intercambio.nombre});
      ir('organizador', {codigo: c, datos});
    } else {
      const datos = await rpc('yo_ver', {p_codigo: c});
      LS.poner('ir_sesion', {codigo: c, tipo: 'participante'});
      guardarReciente({codigo: c, tipo: 'participante', nombre: datos.intercambio.nombre, quien: datos.yo.nombre});
      ir('participante', {codigo: c, datos});
    }
  } catch (e) {
    aviso(e.message, true);
    cargando(btn, false);
  }
}

async function refrescarOrg(silencioso = true) {
  try {
    const d = await rpc('admin_ver', {p_codigo: estado.codigo});
    if (estado.vista !== 'organizador') return;
    estado.datos = d;
    pintarOrgPartes();
  } catch (e) {
    if (!silencioso) aviso(e.message, true);
    if (/no válido/.test(e.message)) { quitarReciente(estado.codigo); LS.quitar('ir_sesion'); ir('inicio'); aviso('Ese intercambio ya no existe', true); }
  }
}

        ${v.lugar ? `<span>${ic('lugar', 's')}${esc(v.lugar)}</span>` : ''}

      : `<div class="sorteo-falta">${faltan ? `Agrega ${faltan === 1 ? '1 persona más' : faltan + ' personas más'} para poder sortear.` : 'Cuando ya estén todos, haz el sorteo. Puedes mandar los códigos antes o después.'}</div>`}
    <div class="acciones">
      ${sorteado

  if (bR) bR.addEventListener('click', () => sortear(true, bR));

function pintarLista() {
  const {intercambio: v, participantes: ps} = estado.datos;
  const f = filtroOrg.trim().toLowerCase();
  const vis = f ? ps.filter(p => p.nombre.toLowerCase().includes(f) || p.codigo.toLowerCase().includes(f)) : ps;
  const ul = $('#oLista');
  if (!ps.length) { ul.innerHTML = `<li class="vacio">Todavía no hay nadie. Empieza por tu nombre.</li>`; return; }
  if (!vis.length) { ul.innerHTML = `<li class="vacio">Nadie coincide con «${esc(filtroOrg)}».</li>`; return; }
  ul.innerHTML = vis.map(p => `<li class="fila" data-id="${p.id}">
      <div style="min-width:0">
        <div class="nombre">${esc(p.nombre)}</div>
        <div class="datos">
          <span class="mono" title="Código de ${esc(p.nombre)}">${esc(p.codigo)}</span>
          <span class="${p.tiene_deseos ? 'marca-si' : 'marca-no'}">${ic(p.tiene_deseos ? 'listo' : 'lista', 's')}${p.tiene_deseos ? 'Con deseos' : 'Sin deseos'}</span>
          ${v.sorteado_en ? `<span class="${p.ya_compro ? 'marca-si' : 'marca-no'}">${ic('bolsa', 's')}${p.ya_compro ? 'Ya compró' : 'Sin comprar'}</span>` : ''}
        </div>
      </div>
      <div class="botones">
        <a class="icono wa" href="https://wa.me/?text=${encodeURIComponent(mensajeWhats(p, v.nombre))}" target="_blank" rel="noopener" title="Mandar a ${esc(p.nombre)} su código por WhatsApp" aria-label="Mandar código por WhatsApp a ${esc(p.nombre)}">${ic('mensaje')}</a>
        <button class="icono" data-acc="copiar" title="Copiar el mensaje con el código de ${esc(p.nombre)}" aria-label="Copiar mensaje de ${esc(p.nombre)}">${ic('copiar')}</button>
        <button class="icono" data-acc="editar" title="Cambiar el nombre, darle otro código o quitar a ${esc(p.nombre)}" aria-label="Editar a ${esc(p.nombre)}">${ic('lapiz')}</button>
      </div>
    </li>`).join('');
  ul.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', () => {
    const p = ps.find(x => x.id === b.closest('.fila').dataset.id);
    if (b.dataset.acc === 'copiar') copiar(mensajeWhats(p, v.nombre), `Mensaje de ${p.nombre} copiado`);
    else editarPersona(p);
  }));
}

async function sortear(otraVez, btn) {
  const n = estado.datos.participantes.length;
  const ok = await confirmar({
    titulo: otraVez ? '¿Volver a sortear?' : `¿Sortear entre ${n} personas?`,
    texto: otraVez ? 'El sorteo anterior se pierde y a todos les puede tocar otra persona. También se borra «ya compré». Avisa al grupo.' : 'A cada quien le tocará otra persona, nunca a sí mismo. Después de sortear, si agregas o quitas a alguien hay que sortear de nuevo.',
    si: otraVez ? 'Sí, sortear de nuevo' : 'Sortear', tipo: 'vino'
  });
  if (!ok) return;
  cargando(btn, true);
  try {
    await rpc('admin_sortear', {p_codigo: estado.codigo});
    await refrescarOrg(false);
    aviso('¡Sorteo hecho! Ahora manda los códigos');
  } catch (e) { aviso(e.message, true); cargando(btn, false); }
}

let deseosSucio = false;
async function refrescarYo() {
  try {
    const d = await rpc('yo_ver', {p_codigo: estado.codigo});
    if (estado.vista !== 'participante') return;
    const antes = JSON.stringify(estado.datos);
    estado.datos = d;
    if (antes !== JSON.stringify(d)) pintarYoPartes();
  } catch (e) {
    if (/No encontramos/.test(e.message)) { quitarReciente(estado.codigo); LS.quitar('ir_sesion'); ir('inicio'); aviso('Tu código ya no sirve. Pídele uno nuevo a quien organiza.', true); }
  }
}

let revelado = false;
function pintarYoPartes() {
  const {intercambio: v, yo, amigo} = estado.datos;
  $('#yCabeza').innerHTML = `<div class="cabeza-txt">
      <p class="eyebrow">${esc(v.nombre)}</p>
      <h1 style="margin-top:8px;overflow-wrap:anywhere">Hola, ${esc(yo.nombre)}</h1>
      <div class="meta">
        <span class="presu">${ic('billete', 's')}Presupuesto: ${quetzales(v.presupuesto)}</span>
        ${v.fecha ? `<span>${ic('fecha', 's')}${esc(fechaLarga(v.fecha))}</span>` : ''}
        ${v.lugar ? `<span>${ic('lugar', 's')}${esc(v.lugar)}</span>` : ''}
      </div>
      ${v.nota ? `<p class="nota">${esc(v.nota)}</p>` : ''}
    </div>`;

  if (amigo) {
    $('#ySecreto').innerHTML = `<div class="secreto">
      <p class="eyebrow">Tu amigo secreto</p>
      <p style="margin-top:8px">Te toca regalarle a…</p>
      <div class="amigo ${revelado ? '' : 'oculto'}" id="yAmigo" aria-hidden="${revelado ? 'false' : 'true'}">${revelado ? esc(amigo.nombre) : 'Nombre oculto'}</div>
      <p>Gasta hasta ${quetzales(v.presupuesto)}. No le cuentes a nadie.</p>
      <button class="btn" id="yRevelar" title="${revelado ? 'Esconder el nombre por si alguien está viendo' : 'Mostrar a quién le regalas'}">${ic('ojo', 's')}${revelado ? 'Ocultar' : 'Ver a quién le regalo'}</button>
    </div>`;
    $('#yRevelar').addEventListener('click', () => { revelado = !revelado; pintarYoPartes(); });
    const ds = lineas(amigo.deseos);
    $('#yDeseosAmigo').innerHTML = `<h2 style="font-size:1.3rem;margin-bottom:14px">Lo que le gustaría${revelado ? ' a ' + esc(amigo.nombre.split(' ')[0]) : ''}</h2>
      ${!revelado ? '<p class="ayuda">Primero toca «Ver a quién le regalo».</p>' : ds.length ? `<ul class="deseos-amigo">${ds.map(x => `<li><span>${enlaces(x)}</span></li>`).join('')}</ul>` : '<p class="vacio">Todavía no escribe su lista. Vuelve a revisar en unos días.</p>'}`;
  } else {
    $('#ySecreto').innerHTML = `<div class="secreto">
      <p class="eyebrow">Tu amigo secreto</p>
      <div class="amigo" style="font-size:clamp(1.8rem,1.4rem + 2vw,2.6rem)">Todavía no hay sorteo</div>
      <p>Cuando quien organiza haga el sorteo, aquí vas a ver a quién le regalas. Mientras, escribe tu lista de deseos.</p>
    </div>`;
    $('#yDeseosAmigo').innerHTML = `<h2 style="font-size:1.3rem;margin-bottom:10px">Lo que le gustaría</h2><p class="ayuda">Aparece después del sorteo.</p>`;
  }

  const ta = $('#yDeseos');
  if (ta && !deseosSucio && document.activeElement !== ta) ta.value = yo.deseos || '';

  pintarCuenta();

  $('#yCompra').innerHTML = `<h2 style="font-size:1.3rem;margin-bottom:14px">Mi regalo</h2>
    <label class="interruptor" title="${amigo ? 'Marca cuando ya tengas el regalo' : 'Se puede marcar después del sorteo'}">
      <span><b style="display:block">Ya compré el regalo</b><span class="ayuda" style="margin:0">${estado.datos.compraron} de ${estado.datos.total} ya lo tienen</span></span>
      <input type="checkbox" id="yCompre" ${yo.ya_compro ? 'checked' : ''} ${amigo ? '' : 'disabled'}><span class="riel"></span>
    </label>`;
  $('#yCompre').addEventListener('change', async e => {
    const val = e.target.checked;
    e.target.disabled = true;
    try {
      await rpc('yo_compre', {p_codigo: estado.codigo, p_valor: val});
      estado.datos.yo.ya_compro = val;
      estado.datos.compraron += val ? 1 : -1;
      aviso(val ? '¡Bien! Ya tienes tu regalo' : 'Marcado como pendiente');
      pintarYoPartes();
    } catch (err) { e.target.checked = !val; e.target.disabled = false; aviso(err.message, true); }
  });
}

function pintarCuenta() {
  const caja = $('#yCuenta');
  if (!caja || !estado.datos) return;
  const v = estado.datos.intercambio;
  if (!v.fecha) { caja.innerHTML = `<h2 style="font-size:1.3rem;margin-bottom:8px">¿Cuándo es?</h2><p class="ayuda">Quien organiza todavía no pone la fecha.</p>`; return; }
  const ms = new Date(v.fecha) - Date.now();
  let cuerpo;
  if (ms <= 0) cuerpo = `<p style="font-weight:600">${ms > -86400000 ? '¡Es hoy! Que lo disfruten.' : 'El intercambio ya pasó.'}</p>`;
  else {
    const d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000);
    cuerpo = `<div class="cuenta"><div><b>${d}</b><span>${d === 1 ? 'día' : 'días'}</span></div><div><b>${h}</b><span>horas</span></div><div><b>${m}</b><span>min</span></div></div>`;
  }
  caja.innerHTML = `<h2 style="font-size:1.3rem;margin-bottom:14px">Falta</h2>${cuerpo}${v.lugar ? `<p class="ayuda" style="margin-top:12px">${ic('lugar', 's')} ${esc(v.lugar)}</p>` : ''}`;
}

$('#irInicio').addEventListener('click', e => { e.preventDefault(); LS.quitar('ir_sesion'); ir('inicio'); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (estado.vista === 'organizador') refrescarOrg();
  if (estado.vista === 'participante') refrescarYo();
});

(function arrancar() {
  ir('inicio');
  const m = location.hash.match(/c=([A-Za-z0-9-]+)/);
  if (m) {
    history.replaceState(null, '', location.pathname + location.search);
    entrarCon(m[1], null);
    return;
  }
  const s = LS.leer('ir_sesion', null);
  if (s && s.codigo && configurado) entrarCon(s.codigo, null);
})();
